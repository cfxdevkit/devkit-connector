version: "3.8"

services:
  conflux-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/usr/src/app:cached
      - /usr/src/app/node_modules
      - conflux-data:/usr/src/app/data
      - conflux-deployments:/usr/src/app/deployments
    ports:
      - "12537:12537" # Core RPC port
      - "8545:8545" # EVM RPC port
      - "3000:3000" # Optional: for web interfaces
    environment:
      - NODE_ENV=development
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu
    command: sleep infinity
    networks:
      - conflux-network

  conflux-node:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "12538:12537" # Different port to avoid conflicts
      - "8546:8545" # Different port to avoid conflicts
    volumes:
      - conflux-data:/usr/src/app/data
      - conflux-deployments:/usr/src/app/deployments
    environment:
      - NODE_ENV=development
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu
    command:
      ["node", "dist/cli.js", "dev", "--port", "12537", "--eth-port", "8545"]
    networks:
      - conflux-network
    depends_on:
      - conflux-dev

volumes:
  conflux-data:
  conflux-deployments:

networks:
  conflux-network:
    driver: bridge
