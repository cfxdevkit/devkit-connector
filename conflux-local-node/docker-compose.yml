version: "3.8"

services:
  conflux-node:
    build: .
    ports:
      - "12537:12537" # Core RPC port
      - "8545:8545" # EVM RPC port
    volumes:
      - ./data:/usr/src/app/data
      - ./deployments:/usr/src/app/deployments
    environment:
      - NODE_ENV=development
    command:
      ["node", "dist/cli.js", "dev", "--port", "12537", "--eth-port", "8545"]
    restart: unless-stopped

  conflux-node-silent:
    build: .
    ports:
      - "12538:12537" # Different port to avoid conflicts
      - "8546:8545" # Different port to avoid conflicts
    volumes:
      - ./data:/usr/src/app/data
      - ./deployments:/usr/src/app/deployments
    environment:
      - NODE_ENV=production
    command:
      [
        "node",
        "dist/cli.js",
        "start",
        "--silent",
        "--port",
        "12537",
        "--eth-port",
        "8545",
      ]
    restart: unless-stopped
