version: '3.8'

services:
  # Local Conflux Node (via @xcfx/node)
  conflux-node:
    build:
      context: .
      dockerfile: Dockerfile.dev-local
    ports:
      - "12537:12537"  # Core RPC
      - "8545:8545"    # EVM RPC
    environment:
      - NODE_ENV=development
      - CONFLUX_CORE_PORT=12537
      - CONFLUX_EVM_PORT=8545
      - CONFLUX_CHAIN_ID=1111
      - CONFLUX_EVM_CHAIN_ID=2222
    volumes:
      - conflux-data:/app/.conflux-dev
      - ./tools/node-manager:/app/tools/node-manager
      - ./contracts:/app/contracts
    command: ["npm", "run", "node:dev"]
    networks:
      - conflux-dev

  # Contract Deployer Service
  contract-deployer:
    build:
      context: .
      dockerfile: Dockerfile.dev-local
    depends_on:
      - conflux-node
    environment:
      - NODE_ENV=development
      - CONFLUX_CORE_RPC=http://conflux-node:12537
      - CONFLUX_EVM_RPC=http://conflux-node:8545
    volumes:
      - ./contracts:/app/contracts
      - ./deployments:/app/deployments
    command: ["npm", "run", "contracts:deploy:local"]
    networks:
      - conflux-dev

  # Test Runner Service
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.dev-local
    depends_on:
      - conflux-node
      - contract-deployer
    environment:
      - NODE_ENV=development
      - CONFLUX_CORE_RPC=http://conflux-node:12537
      - CONFLUX_EVM_RPC=http://conflux-node:8545
    volumes:
      - ./contracts:/app/contracts
      - ./test-results:/app/test-results
    command: ["npm", "run", "contracts:test:local"]
    networks:
      - conflux-dev

  # Development Dashboard
  dev-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev-local
    ports:
      - "3000:3000"
    depends_on:
      - conflux-node
    environment:
      - NODE_ENV=development
      - CONFLUX_CORE_RPC=http://conflux-node:12537
      - CONFLUX_EVM_RPC=http://conflux-node:8545
    volumes:
      - ./apps/demo-app:/app/apps/demo-app
      - ./packages:/app/packages
    command: ["npm", "run", "demos:pattern-a"]
    networks:
      - conflux-dev

volumes:
  conflux-data:
    driver: local

networks:
  conflux-dev:
    driver: bridge
