version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: conflux-wallet-postgres
    environment:
      POSTGRES_DB: conflux_wallet
      POSTGRES_USER: conflux_user
      POSTGRES_PASSWORD: conflux_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conflux_user -d conflux_wallet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: conflux-wallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conflux-wallet-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://conflux_user:conflux_password@postgres:5432/conflux_wallet
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-jwt-secret-key
      WALLET_ENCRYPTION_KEY: your-32-byte-hex-encryption-key
      NEXT_PUBLIC_CONFLUX_ESPACE_RPC: https://evm.confluxrpc.com
      NEXT_PUBLIC_CONFLUX_CORE_RPC: https://main.confluxrpc.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # Development Database (for local development)
  postgres-dev:
    image: postgres:15-alpine
    container_name: conflux-wallet-postgres-dev
    environment:
      POSTGRES_DB: conflux_wallet_dev
      POSTGRES_USER: conflux_user
      POSTGRES_PASSWORD: conflux_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    profiles:
      - dev

  # Development Redis (for local development)
  redis-dev:
    image: redis:7-alpine
    container_name: conflux-wallet-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    profiles:
      - dev

volumes:
  postgres_data:
  postgres_dev_data:
  redis_data:
  redis_dev_data:
