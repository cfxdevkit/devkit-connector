apiVersion: apps/v1
kind: Deployment
metadata:
  name: conflux-wallet-app
  namespace: conflux-wallet
  labels:
    app: conflux-wallet-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: conflux-wallet-app
  template:
    metadata:
      labels:
        app: conflux-wallet-app
    spec:
      containers:
      - name: app
        image: conflux-wallet:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: conflux-wallet-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: conflux-wallet-secrets
              key: REDIS_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: conflux-wallet-secrets
              key: JWT_SECRET
        - name: WALLET_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: conflux-wallet-secrets
              key: WALLET_ENCRYPTION_KEY
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: conflux-wallet-secrets
              key: NEXTAUTH_SECRET
        - name: ENCRYPTED_WALLET_MNEMONIC
          valueFrom:
            secretKeyRef:
              name: conflux-wallet-secrets
              key: ENCRYPTED_WALLET_MNEMONIC
        envFrom:
        - configMapRef:
            name: conflux-wallet-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      restartPolicy: Always
