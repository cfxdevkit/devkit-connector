version: '3.8'

services:
  devkit-node:
    build:
      context: ./packages/devkit-node
      dockerfile: Dockerfile
    ports:
      - '12537:12537'
      - '8545:8545'
    volumes:
      - devkit-node-data:/app/data
    environment:
      - NODE_ENV=development
    networks:
      - devkit-network

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - ESPACE_RPC_URL=http://devkit-node:8545
    depends_on:
      - devkit-node
    networks:
      - devkit-network

  dashboard:
    build:
      context: ./packages/dashboard
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_RPC_URL=http://localhost:12537
    depends_on:
      - server
    networks:
      - devkit-network

volumes:
  devkit-node-data:

networks:
  devkit-network:
    driver: bridge
