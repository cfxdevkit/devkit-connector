    <!-- Module Resolution Error Detection -->
    <script>
      // Monitor for module resolution errors
      window.addEventListener('error', event => {
        if (
          event.message &&
          event.message.includes('Failed to resolve module specifier')
        ) {
          console.error('🚨 MODULE RESOLUTION ERROR:', event.message);
          console.error('📍 File:', event.filename);
          console.error('📍 Line:', event.lineno);
          console.error('📍 Column:', event.colno);

          // Extract the module specifier from the error message
          const match = event.message.match(
            /Failed to resolve module specifier "([^"]+)"/
          );
          if (match) {
            const moduleSpecifier = match[1];
            console.error('🔍 Missing module:', moduleSpecifier);
            console.error(
              '💡 Add to import map:',
              `"${moduleSpecifier}": "https://unpkg.com/${moduleSpecifier}@latest"`
            );
          }
        }
      });

      // Monitor for unhandled promise rejections (often module loading errors)
      window.addEventListener('unhandledrejection', event => {
        if (
          event.reason &&
          event.reason.message &&
          event.reason.message.includes('Failed to resolve module specifier')
        ) {
          console.error(
            '🚨 MODULE RESOLUTION ERROR (Promise):',
            event.reason.message
          );
        }
      });

      console.log('🔍 Module resolution error monitoring enabled');
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        color: #333;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
        color: white;
      }

      .header h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .header p {
        font-size: 1.2rem;
        opacity: 0.9;
      }

      .showcase-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 30px;
        margin-bottom: 40px;
      }

      .showcase-card {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .showcase-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .showcase-card h2 {
        color: #4a5568;
        margin-bottom: 15px;
        font-size: 1.5rem;
      }

      .showcase-card p {
        color: #718096;
        margin-bottom: 20px;
        line-height: 1.6;
      }

      .demo-area {
        border: 2px dashed #e2e8f0;
        border-radius: 8px;
        padding: 20px;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7fafc;
      }

      .demo-area {
        text-align: center;
        color: #2d3748;
        padding: 2rem;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        background: #ffffff;
      }

      .demo-area h3 {
        margin-bottom: 10px;
        color: #2b6cb0;
      }

      .demo-area p {
        font-size: 0.9rem;
        color: #4a5568;
      }

      .features {
        background: white;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        margin-bottom: 40px;
      }

      .features h2 {
        text-align: center;
        color: #4a5568;
        margin-bottom: 30px;
        font-size: 2rem;
      }

      .features-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
      }

      .feature {
        text-align: center;
      }

      .feature-icon {
        font-size: 3rem;
        margin-bottom: 15px;
      }

      .feature h3 {
        color: #4a5568;
        margin-bottom: 10px;
        font-size: 1.2rem;
      }

      .feature p {
        color: #718096;
        line-height: 1.6;
      }

      .integration-examples {
        background: white;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .integration-examples h2 {
        text-align: center;
        color: #4a5568;
        margin-bottom: 30px;
        font-size: 2rem;
      }

      .code-example {
        background: #2d3748;
        color: #e2e8f0;
        padding: 20px;
        border-radius: 8px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 14px;
        line-height: 1.6;
        overflow-x: auto;
        margin: 20px 0;

        color: #68d391;
      }

      .code-example .keyword {

      }

      .code-example .string {

      }

      .footer {

        color: white;
        margin-top: 40px;
        padding: 20px;
      }

      .footer a {
        color: white;
        text-decoration: none;
        font-weight: 500;
      }

      .footer a:hover {

      }

      .status-indicator {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
      }

      .status-online {
        background: #10b981;
        animation: pulse 2s infinite;
      }

      .status-offline {
        background: #ef4444;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .btn {
        display: inline-block;
        padding: 10px 20px;
        background: #3b82f6;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 500;
        transition: background 0.3s ease;
        border: none;
        cursor: pointer;
        font-size: 14px;
      }

      .btn:hover {
        background: #2563eb;
      }

      .btn.secondary {
        background: #6b7280;
      }

      .btn.secondary:hover {
        background: #4b5563;
