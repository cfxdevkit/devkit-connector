version: '3.8'

services:
  # Conflux eSpace Node (EVM-compatible)
  conflux-espace:
    image: confluxchain/conflux-rust:latest
    container_name: conflux-espace
    ports:
      - "12537:12537"
    environment:
      - CONFLUX_NETWORK=testnet
      - CONFLUX_RPC_PORT=12537
      - CONFLUX_WS_PORT=12538
    command: [
      "--testnet",
      "--rpc",
      "--rpc-addr", "0.0.0.0:12537",
      "--rpc-port", "12537",
      "--ws",
      "--ws-addr", "0.0.0.0:12538",
      "--ws-port", "12538",
      "--jsonrpc-http-keep-alive",
      "--jsonrpc-http-keep-alive-timeout", "30",
      "--jsonrpc-http-keep-alive-interval", "5"
    ]
    volumes:
      - conflux-espace-data:/root/.conflux
    networks:
      - conflux-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12537"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Conflux Core Node
  conflux-core:
    image: confluxchain/conflux-rust:latest
    container_name: conflux-core
    ports:
      - "12539:12539"
    environment:
      - CONFLUX_NETWORK=testnet
      - CONFLUX_RPC_PORT=12539
      - CONFLUX_WS_PORT=12540
    command: [
      "--testnet",
      "--rpc",
      "--rpc-addr", "0.0.0.0:12539",
      "--rpc-port", "12539",
      "--ws",
      "--ws-addr", "0.0.0.0:12540",
      "--ws-port", "12540",
      "--jsonrpc-http-keep-alive",
      "--jsonrpc-http-keep-alive-timeout", "30",
      "--jsonrpc-http-keep-alive-interval", "5"
    ]
    volumes:
      - conflux-core-data:/root/.conflux
    networks:
      - conflux-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12539"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: conflux-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - ESPACE_RPC_URL=http://conflux-espace:12537
      - CORE_RPC_URL=http://conflux-core:12539
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - DEPLOYMENTS_PATH=/app/deployments
    volumes:
      - ./deployment/deployments:/app/deployments
      - ./logs:/app/logs
    networks:
      - conflux-network
    depends_on:
      conflux-espace:
        condition: service_healthy
      conflux-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conflux-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_ESPACE_RPC_URL=http://localhost:12537
      - REACT_APP_CORE_RPC_URL=http://localhost:12539
    networks:
      - conflux-network
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  conflux-espace-data:
    driver: local
  conflux-core-data:
    driver: local

networks:
  conflux-network:
    driver: bridge

